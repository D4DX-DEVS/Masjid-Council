<!doctype html>
<html lang="ml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons. favicon.ico must exist as a real file: Google's favicon fetcher does
         not run JavaScript, and the SPA redirect would otherwise answer with HTML. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- No SVG icon here on purpose. mosque.svg is a generic mosque outline, and
         Google picks one candidate from this list — offering it risks a generic
         glyph in search results instead of the Masjid Council mark. Every entry
         above is generated from src/assets/mc-logo2.webp by scripts/generate-icons.mjs. -->
    <meta name="theme-color" content="#186b3a" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta name="author" content="Masjid Council Kerala" />
    <meta name="geo.region" content="IN-KL" />
    <meta name="geo.placename" content="Kerala, India" />

    <!-- Title, description, canonical, Open Graph, Twitter and JSON-LD are per-route.
         They come from src/lib/seo.js: rendered by RouteSeo at runtime and baked into
         static HTML per route by scripts/prerender.mjs at build time. Do not add them
         back here — two title or canonical elements in one document is undefined
         behaviour for browsers and crawlers alike. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
